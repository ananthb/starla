[package]
name = "starla"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Starla — open-source RIPE Atlas software probe (main binary)"
repository.workspace = true

[[bin]]
name = "starla"
path = "src/main.rs"

[dependencies]
starla-common = { workspace = true }
starla-network = { workspace = true }
starla-scheduler = { workspace = true }
starla-controller = { workspace = true }
starla-results = { workspace = true }
starla-metrics = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[features]
default = ["observability"]
observability = ["metrics-export", "structured-logging"]
metrics-export = ["starla-metrics/export"]
structured-logging = ["starla-common/json"]
minimal = []
