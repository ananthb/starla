name: starla
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: Ananth Bhaskararaman <ab@calculon.tech>
description: A Rust implementation of the RIPE Atlas Software Probe
vendor: Starla Contributors
homepage: https://github.com/ananthb/starla
license: AGPL-3.0-or-later

contents:
  - src: ./starla
    dst: /usr/bin/starla
    file_info:
      mode: 0755

  - src: ./starla.service
    dst: /usr/lib/systemd/system/starla.service
    type: config

  - src: ./config.toml.example
    dst: /etc/starla/config.toml.example

  - dst: /etc/starla
    type: dir
    file_info:
      mode: 0750

  # apt repository config — auto-configures updates
  - src: ./starla.gpg
    dst: /usr/share/keyrings/starla.gpg
    packager: deb

  - src: ./starla.sources
    dst: /etc/apt/sources.list.d/starla.sources
    type: config
    packager: deb

  # dnf/yum repository config — auto-configures updates
  - src: ./starla.repo
    dst: /etc/yum.repos.d/starla.repo
    type: config
    packager: rpm

deb:
  compression: zstd

rpm:
  compression: zstd
  group: Applications/Internet
