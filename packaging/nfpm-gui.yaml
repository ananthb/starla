name: starla-gui
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: Ananth Bhaskararaman <ab@calculon.tech>
description: Starla system tray app for RIPE Atlas probe monitoring
vendor: Starla Contributors
homepage: https://github.com/ananthb/starla
license: AGPL-3.0-or-later

depends:
  - starla

contents:
  - src: ./starla-tray
    dst: /usr/bin/starla-tray
    file_info:
      mode: 0755

  - src: ./starla-tray.desktop
    dst: /usr/share/applications/starla-tray.desktop

  - src: ./starla-tray.desktop
    dst: /etc/xdg/autostart/starla-tray.desktop
    type: config

deb:
  compression: zstd

rpm:
  compression: zstd
  group: Applications/Internet
