name: Nix flake update

on:
  schedule:
    # Monday 06:00 Asia/Kolkata = 00:30 UTC. Matches dependabot's cadence.
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # crates.io now 403s any User-Agent starting with "curl/", and
          # nixpkgs' fetchurl sends "curl/<ver> Nixpkgs/<ver>". NIX_CURL_FLAGS
          # is appended after that flag so the later -A wins; the short form
          # is joined to its value because impure-env splits on spaces.
          extra-conf: |
            extra-experimental-features = configurable-impure-env
            impure-env = NIX_CURL_FLAGS=-ANixpkgs

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake inputs
        run: nix flake update --commit-lock-file

      - name: Verify flake still checks
        run: nix flake check

      - uses: peter-evans/create-pull-request@v8
        with:
          # Reuse the existing commit nix flake update produced.
          branch: chore/flake-update
          delete-branch: true
          title: "chore(deps): nix flake update"
          body: |
            Weekly `nix flake update` run. Inputs refreshed; `nix flake check` passes on the runner.

            See `flake.lock` diff for what moved.
          labels: |
            dependencies
            nix
