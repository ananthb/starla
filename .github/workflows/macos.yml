name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build packages
        run: |
          nix build .#default
          nix build .#starla-tray

      # `--all-features` would enable scamper, but the macOS dev shell
       # doesn't ship libscamperfile/libscamperctrl so linking fails.
       # scamper coverage stays on Linux's nix flake check.
      - name: Run tests
        run: |
          nix develop -c cargo test --workspace
