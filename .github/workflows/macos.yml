name: macOS

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'README.md'
      - '.github/dependabot.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # crates.io now 403s any User-Agent starting with "curl/", and
          # nixpkgs' fetchurl sends "curl/<ver> Nixpkgs/<ver>". NIX_CURL_FLAGS
          # is appended after that flag so the later -A wins; the short form
          # is joined to its value because impure-env splits on spaces.
          extra-conf: |
            impure-env = NIX_CURL_FLAGS=-ANixpkgs

      - name: Build packages
        run: |
          nix build .#default
          nix build .#starla-tray

      - name: Run tests
        run: |
          nix develop -c cargo test --workspace
