name: i18n

# Translations arrive from Weblate rather than from a contributor running
# the test suite, so everything that a bad catalogue can break is checked
# here: Fluent syntax and placeholder parity, the generated desktop entry,
# and the multi-language docs build. The Home Assistant add-on's option
# labels moved to ananthb/hass-addons and are checked by its own CI.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'binaries/starla-tray/**'
      - 'doc/**'
      - 'packaging/starla-tray.desktop'
      - 'packaging/Info.plist'
      - '.weblate'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # crates.io now 403s any User-Agent starting with "curl/", and
          # nixpkgs' fetchurl sends "curl/<ver> Nixpkgs/<ver>". NIX_CURL_FLAGS
          # is appended after that flag so the later -A wins; the short form
          # is joined to its value because impure-env splits on spaces.
          extra-conf: |
            extra-experimental-features = configurable-impure-env
            impure-env = NIX_CURL_FLAGS=-ANixpkgs

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Catalogue parity, plus the freshness of packaging/starla-tray.desktop
      # and the languages declared in packaging/Info.plist.
      - name: Check translation catalogues
        run: nix develop -c cargo test -p starla-tray

      - name: Build the documentation site in every language
        run: nix develop -c python3 doc/assemble.py --source doc --out site

      - name: Validate the desktop entry
        run: nix develop -c desktop-file-validate packaging/starla-tray.desktop
