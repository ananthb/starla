name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      # The `scamper` feature pulls in rscamper, which doesn't build on
      # Windows (uses libc::suseconds_t/time_t types that aren't defined
      # for MSVC targets). Stick to the default feature set here.
      - name: Build probe
        run: cargo build --bin starla

      - name: Run tests
        run: cargo test --workspace --exclude starla-tray
