name: ASAN

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'README.md'
      - '.github/dependabot.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # crates.io now 403s any User-Agent starting with "curl/", and
          # nixpkgs' fetchurl sends "curl/<ver> Nixpkgs/<ver>". NIX_CURL_FLAGS
          # is appended after that flag so the later -A wins; the short form
          # is joined to its value because impure-env splits on spaces.
          extra-conf: |
            extra-experimental-features = configurable-impure-env
            impure-env = NIX_CURL_FLAGS=-ANixpkgs

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run tests with AddressSanitizer
        run: |
          nix develop -c cargo test --workspace \
            --exclude starla-tray \
            -Zbuild-std --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Zsanitizer=address"
