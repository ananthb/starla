name: Docs gate

# The ruleset on main requires two status checks, `build` and `check`, and
# every workflow that reports either one skips documentation-only pull
# requests. Nothing reports them on a documentation change, so the pull
# request sits blocked forever waiting for jobs that will never run —
# including the ones Weblate opens, which only ever touch doc/ and README
# files. Report both here for exactly the paths those workflows ignore.
#
# `build` comes from the macOS and Windows workflows, `check` from ci.yml.
# The paths below must stay the mirror image of ci.yml's `paths-ignore`:
# if the two lists drift, a pull request either blocks forever again or
# gets a green `check` it never earned.
on:
  pull_request:
    paths:
      - 'doc/**'
      - '**/*.md'
      - 'README.md'
      - '.github/dependabot.yml'

# The jobs build nothing and check out nothing.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Documentation-only change; the platform builds are unaffected."

  check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Documentation-only change; the nix flake check is unaffected."
