name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Garnix cache
        run: |
          nix config set extra-substituters "https://cache.garnix.io"
          nix config set extra-trusted-public-keys "cache.garnix.io:CTFPyKSLcx5RMJKfLo5EEPUObbA78b0YQ2DTCJXqr9g="

      - name: Build release artifacts
        run: nix build .#release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            result/*
          generate_release_notes: true

      - name: Build OCI image
        run: nix build .#oci

      - name: Push OCI image to ghcr.io
        run: |
          nix shell nixpkgs#skopeo -c skopeo copy \
            --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker-archive:$(readlink result)" \
            "docker://ghcr.io/ananthb/starla:${GITHUB_REF_NAME}"
          nix shell nixpkgs#skopeo -c skopeo copy \
            --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker-archive:$(readlink result)" \
            "docker://ghcr.io/ananthb/starla:latest"
