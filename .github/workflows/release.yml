name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            nix-system: x86_64-linux
            rpm-arch: x86_64
            appimage-arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            nix-system: aarch64-linux
            rpm-arch: aarch64
            appimage-arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Build release tarball
        run: nix build .#packages.${{ matrix.nix-system }}.release -o result

      - name: Build packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          RPM_ARCH="${{ matrix.rpm-arch }}"

          # Extract binaries from tarball (includes both starla and starla-tray)
          mkdir -p pkg
          tar -xzf "$(readlink result)" -C pkg
          cp packaging/nfpm.yaml packaging/starla.gpg packaging/starla.sources packaging/starla.repo pkg/starla/

          # Headless packages
          cd pkg/starla
          ARCH="$ARCH" VERSION="$VERSION" nix shell nixpkgs#nfpm -c \
            nfpm package -p deb -f nfpm.yaml
          ARCH="$RPM_ARCH" VERSION="$VERSION" nix shell nixpkgs#nfpm -c \
            nfpm package -p rpm -f nfpm.yaml
          cd ../..

          # GUI packages
          mkdir -p gui-pkg
          cp pkg/starla/starla-tray gui-pkg/
          cp packaging/nfpm-gui.yaml packaging/starla-tray.desktop gui-pkg/
          cd gui-pkg
          ARCH="$ARCH" VERSION="$VERSION" nix shell nixpkgs#nfpm -c \
            nfpm package -p deb -f nfpm-gui.yaml
          ARCH="$RPM_ARCH" VERSION="$VERSION" nix shell nixpkgs#nfpm -c \
            nfpm package -p rpm -f nfpm-gui.yaml
          cd ..

          # AppImage
          nix build .#packages.${{ matrix.nix-system }}.appimage -o result-appimage

          # Collect
          mkdir -p dist
          cp "$(readlink result)" "dist/starla-${ARCH}.tar.gz"
          cp "$(readlink result-appimage)" "dist/starla-tray-${{ matrix.appimage-arch }}.AppImage"
          mv pkg/starla/*.deb pkg/starla/*.rpm dist/
          mv gui-pkg/*.deb gui-pkg/*.rpm dist/

      - name: Sign artifacts
        run: |
          cd dist
          for f in *; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts-${{ matrix.arch }}
          path: dist/

      - name: Build OCI image
        run: |
          nix build .#packages.${{ matrix.nix-system }}.oci -o result-oci
          mkdir -p oci-stage
          cp -L "$(readlink result-oci)" "oci-stage/starla-${{ matrix.arch }}.oci.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: oci-${{ matrix.arch }}
          path: oci-stage/

  linux-image:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: sigstore/cosign-installer@v3

      - uses: actions/download-artifact@v8
        with:
          pattern: oci-*
          path: oci

      - name: Push per-arch OCI archives to local registry
        run: |
          for arch in amd64 arm64; do
            skopeo copy --dest-tls-verify=false \
              "docker-archive:oci/oci-${arch}/starla-${arch}.oci.tar.gz" \
              "docker://localhost:5000/starla:${GITHUB_REF_NAME}-${arch}"
          done

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and push multi-arch image
        id: imagetools
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}" \
            --tag "ghcr.io/ananthb/starla:latest" \
            "localhost:5000/starla:${GITHUB_REF_NAME}-amd64" \
            "localhost:5000/starla:${GITHUB_REF_NAME}-arm64"

          raw=$(docker buildx imagetools inspect "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}" --raw)
          {
            echo "amd64_digest=$(echo "$raw" | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest')"
            echo "arm64_digest=$(echo "$raw" | jq -r '.manifests[] | select(.platform.architecture=="arm64") | .digest')"
          } >> "$GITHUB_OUTPUT"

      - name: Sign images
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}"
          cosign sign "ghcr.io/ananthb/starla:latest"
          cosign sign "ghcr.io/ananthb/starla@${{ steps.imagetools.outputs.amd64_digest }}"
          cosign sign "ghcr.io/ananthb/starla@${{ steps.imagetools.outputs.arm64_digest }}"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build DMG
        run: |
          nix build .#packages.aarch64-darwin.release -o result-dmg
          mkdir -p dist
          cp "$(readlink result-dmg)" dist/starla-macos-arm64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly

      - name: Build probe
        run: cargo build --release --bin starla

      - name: Build MSI
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p msi-staging
          cp target/release/starla.exe msi-staging/
          cp config.toml.example msi-staging/
          cp packaging/starla.wxs msi-staging/
          cd msi-staging
          dotnet tool install --global wix --version 5.0.2
          wix build starla.wxs -d Version="$VERSION" -arch x64 -o starla.msi

      - name: Package Windows release
        shell: bash
        run: |
          mkdir -p dist
          cp msi-staging/starla.msi dist/starla-windows-amd64.msi

      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: dist/

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: sigstore/cosign-installer@v3

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Sign macOS and Windows artifacts
      - name: Sign non-Linux artifacts
        run: |
          cd artifacts
          for f in starla-macos-*.dmg starla-windows-*.msi; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          # Regenerate checksums for all artifacts
          sha256sum $(ls -1 | grep -v '\.sig$\|\.pem$\|SHA256SUMS') > SHA256SUMS
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

  crates-io:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # In dep order — each crate's deps must be on crates.io first.
          CRATES=(
            starla-common
            starla-network
            starla-controller
            starla-metrics
            starla-measurements
            starla-results
            starla-scheduler
            starla
            starla-tray
          )
          VER="${VERSION#v}"

          version_published() {
            local name=$1
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/${name}/${VER}")
            [[ "$code" == "200" ]]
          }

          crate_exists() {
            local name=$1
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/${name}")
            [[ "$code" == "200" ]]
          }

          # Filter out crates whose current version is already on crates.io.
          pending=()
          for crate in "${CRATES[@]}"; do
            if version_published "$crate"; then
              echo "✓ ${crate} ${VER} already published — skipping"
            else
              pending+=("$crate")
            fi
          done

          if [[ ${#pending[@]} -eq 0 ]]; then
            echo "All workspace crates already published at ${VER}."
            exit 0
          fi

          is_new=()
          for crate in "${pending[@]}"; do
            if crate_exists "$crate"; then
              is_new+=("false")
            else
              is_new+=("true")
            fi
          done

          for i in "${!pending[@]}"; do
            crate="${pending[$i]}"
            if [[ $i -gt 0 && "${is_new[$i]}" == "true" && "${is_new[$((i-1))]}" == "true" ]]; then
              echo "Sleeping 605s before next new-crate publish (rate limit)"
              sleep 605
            fi
            echo "→ Publishing ${crate}"
            nix develop -c cargo publish -p "$crate"
          done
