name: Release

on:
  push:
    tags:
      - "v*"

# Binary builds (Rust + static libscamper) stay in nix. Goreleaser
# owns Linux packaging (deb/rpm/tar.gz fan-out, SHA256SUMS,
# cosign-on-checksum, GH release upload). Non-Linux + AppImage
# artifacts are produced by their respective tools and attached via
# goreleaser's extra_files. See .goreleaser.yaml for the contract
# between nix and goreleaser.

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches workspace version
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          ws_ver=$(awk -F\" '/^\[workspace\.package\]/{f=1} f && /^version *=/ {print $2; exit}' Cargo.toml)
          if [[ "$tag_ver" != "$ws_ver" ]]; then
            echo "::error::tag $GITHUB_REF_NAME (=$tag_ver) does not match Cargo.toml workspace version $ws_ver"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches Cargo.toml workspace version $ws_ver"
          addon_ver=$(awk -F\" '/^version:/ {print $2; exit}' starla/config.yaml)
          if [[ "$tag_ver" != "$addon_ver" ]]; then
            echo "::error::tag $GITHUB_REF_NAME (=$tag_ver) does not match Home Assistant add-on version $addon_ver in starla/config.yaml"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches Home Assistant add-on version $addon_ver"

  linux:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            nix-system: x86_64-linux
            appimage-arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            nix-system: aarch64-linux
            appimage-arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # crates.io now 403s any User-Agent starting with "curl/", and
          # nixpkgs' fetchurl sends "curl/<ver> Nixpkgs/<ver>". NIX_CURL_FLAGS
          # is appended after that flag so the later -A wins; the short form
          # is joined to its value because impure-env splits on spaces.
          extra-conf: |
            impure-env = NIX_CURL_FLAGS=-ANixpkgs

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Extract nix-built binaries
        # Output dir is `release-bins/` — the repo already has a
        # `binaries/` source tree, so `mkdir -p binaries` is a no-op
        # and the cp would collide with the tracked `binaries/starla-tray/`.
        run: |
          nix build .#packages.${{ matrix.nix-system }}.release -o result
          mkdir -p staging release-bins
          tar -xzf "$(readlink result)" -C staging
          cp staging/starla/starla staging/starla/starla-tray release-bins/

      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries-${{ matrix.arch }}
          path: release-bins/
          if-no-files-found: error

      - name: Build AppImage
        run: |
          nix build .#packages.${{ matrix.nix-system }}.appimage -o result-appimage
          mkdir -p appimage
          cp -L "$(readlink result-appimage)" \
            "appimage/starla-tray-${{ matrix.appimage-arch }}.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: appimage/
          if-no-files-found: error

      - name: Build OCI image
        run: |
          nix build .#packages.${{ matrix.nix-system }}.oci -o result-oci
          mkdir -p oci-stage
          cp -L "$(readlink result-oci)" "oci-stage/starla-${{ matrix.arch }}.oci.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: oci-${{ matrix.arch }}
          path: oci-stage/
          if-no-files-found: error

  linux-image:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: sigstore/cosign-installer@v3

      - uses: actions/download-artifact@v8
        with:
          pattern: oci-*
          path: oci

      - name: Push per-arch OCI archives to local registry
        run: |
          for arch in amd64 arm64; do
            skopeo copy --dest-tls-verify=false \
              "docker-archive:oci/oci-${arch}/starla-${arch}.oci.tar.gz" \
              "docker://localhost:5000/starla:${GITHUB_REF_NAME}-${arch}"
          done

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and push multi-arch image
        id: imagetools
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}" \
            --tag "ghcr.io/ananthb/starla:latest" \
            "localhost:5000/starla:${GITHUB_REF_NAME}-amd64" \
            "localhost:5000/starla:${GITHUB_REF_NAME}-arm64"

          raw=$(docker buildx imagetools inspect "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}" --raw)
          {
            echo "amd64_digest=$(echo "$raw" | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest')"
            echo "arm64_digest=$(echo "$raw" | jq -r '.manifests[] | select(.platform.architecture=="arm64") | .digest')"
          } >> "$GITHUB_OUTPUT"

      - name: Sign images
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}"
          cosign sign "ghcr.io/ananthb/starla:latest"
          cosign sign "ghcr.io/ananthb/starla@${{ steps.imagetools.outputs.amd64_digest }}"
          cosign sign "ghcr.io/ananthb/starla@${{ steps.imagetools.outputs.arm64_digest }}"

  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # crates.io now 403s any User-Agent starting with "curl/", and
          # nixpkgs' fetchurl sends "curl/<ver> Nixpkgs/<ver>". NIX_CURL_FLAGS
          # is appended after that flag so the later -A wins; the short form
          # is joined to its value because impure-env splits on spaces.
          extra-conf: |
            impure-env = NIX_CURL_FLAGS=-ANixpkgs
      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build DMG
        run: |
          nix build .#packages.aarch64-darwin.release -o result-dmg
          mkdir -p dmg
          cp "$(readlink result-dmg)" dmg/starla-macos-arm64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: dmg/
          if-no-files-found: error

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly

      - name: Build probe
        run: cargo build --release --bin starla

      - name: Build MSI
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p msi-staging
          cp target/release/starla.exe msi-staging/
          cp config.toml.example msi-staging/
          cp packaging/starla.wxs msi-staging/
          cd msi-staging
          dotnet tool install --global wix --version 5.0.2
          wix build starla.wxs -d Version="$VERSION" -arch x64 -o starla.msi

      - name: Package Windows release
        shell: bash
        run: |
          mkdir -p msi
          cp msi-staging/starla.msi msi/starla-windows-amd64.msi

      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: msi/
          if-no-files-found: error

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: sigstore/cosign-installer@v3
      # Goreleaser still wants `go` in $PATH even with gobinary=true
      # — it shells out to `go list -m` during gomod detection, then
      # gracefully skips when it sees there's no go.mod.
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # Stage nix-built binaries where goreleaser's per-build
      # hooks.post will look for them.
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries-amd64
          path: prebuilt/linux_amd64
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries-arm64
          path: prebuilt/linux_arm64
      - name: Restore binary permissions
        run: chmod +x prebuilt/linux_amd64/* prebuilt/linux_arm64/*

      # Stage non-goreleaser-produced artifacts that should land in
      # the release and be covered by SHA256SUMS.
      - uses: actions/download-artifact@v8
        with:
          name: linux-appimage-amd64
          path: extras
      - uses: actions/download-artifact@v8
        with:
          name: linux-appimage-arm64
          path: extras
      - uses: actions/download-artifact@v8
        with:
          name: macos-artifacts
          path: extras
      - uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
          path: extras

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  crates-io:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # crates.io now 403s any User-Agent starting with "curl/", and
          # nixpkgs' fetchurl sends "curl/<ver> Nixpkgs/<ver>". NIX_CURL_FLAGS
          # is appended after that flag so the later -A wins; the short form
          # is joined to its value because impure-env splits on spaces.
          extra-conf: |
            impure-env = NIX_CURL_FLAGS=-ANixpkgs

      - uses: cachix/cachix-action@v17
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # In dep order — each crate's deps must be on crates.io first.
          CRATES=(
            starla-common
            starla-network
            starla-controller
            starla-metrics
            starla-measurements
            starla-results
            starla-scheduler
            starla
            starla-tray
          )
          VER="${VERSION#v}"

          # crates.io 403s anonymous requests without a User-Agent.
          UA="starla-release-check (https://github.com/ananthb/starla)"

          version_published() {
            local name=$1
            local code
            code=$(curl -sS -A "$UA" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/${name}/${VER}")
            [[ "$code" == "200" ]]
          }

          crate_exists() {
            local name=$1
            local code
            code=$(curl -sS -A "$UA" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/${name}")
            [[ "$code" == "200" ]]
          }

          # Filter out crates whose current version is already on crates.io.
          pending=()
          for crate in "${CRATES[@]}"; do
            if version_published "$crate"; then
              echo "✓ ${crate} ${VER} already published — skipping"
            else
              pending+=("$crate")
            fi
          done

          if [[ ${#pending[@]} -eq 0 ]]; then
            echo "All workspace crates already published at ${VER}."
            exit 0
          fi

          is_new=()
          for crate in "${pending[@]}"; do
            if crate_exists "$crate"; then
              is_new+=("false")
            else
              is_new+=("true")
            fi
          done

          for i in "${!pending[@]}"; do
            crate="${pending[$i]}"
            if [[ $i -gt 0 && "${is_new[$i]}" == "true" && "${is_new[$((i-1))]}" == "true" ]]; then
              echo "Sleeping 605s before next new-crate publish (rate limit)"
              sleep 605
            fi
            echo "→ Publishing ${crate}"
            nix develop -c cargo publish -p "$crate"
          done
