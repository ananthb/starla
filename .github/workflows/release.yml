name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            nix-system: x86_64-linux
            rpm-arch: x86_64
            appimage-arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            nix-system: aarch64-linux
            rpm-arch: aarch64
            appimage-arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Build release tarball
        run: nix build .#packages.${{ matrix.nix-system }}.release -o result

      - name: Build packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          RPM_ARCH="${{ matrix.rpm-arch }}"

          # Extract binaries from tarball (includes both starla and starla-tray)
          mkdir -p pkg
          tar -xzf "$(readlink result)" -C pkg
          cp packaging/nfpm.yaml packaging/starla.gpg packaging/starla.sources packaging/starla.repo pkg/starla/

          # Headless packages
          cd pkg/starla
          ARCH="$ARCH" VERSION="$VERSION" nix shell nixpkgs#nfpm -c \
            nfpm package -p deb -f nfpm.yaml
          ARCH="$RPM_ARCH" VERSION="$VERSION" nix shell nixpkgs#nfpm -c \
            nfpm package -p rpm -f nfpm.yaml
          cd ../..

          # GUI packages
          mkdir -p gui-pkg
          cp pkg/starla/starla-tray gui-pkg/
          cp packaging/nfpm-gui.yaml packaging/starla-tray.desktop gui-pkg/
          cd gui-pkg
          ARCH="$ARCH" VERSION="$VERSION" nix shell nixpkgs#nfpm -c \
            nfpm package -p deb -f nfpm-gui.yaml
          ARCH="$RPM_ARCH" VERSION="$VERSION" nix shell nixpkgs#nfpm -c \
            nfpm package -p rpm -f nfpm-gui.yaml
          cd ..

          # AppImage
          nix build .#packages.${{ matrix.nix-system }}.appimage -o result-appimage

          # Collect
          mkdir -p dist
          cp "$(readlink result)" "dist/starla-${ARCH}.tar.gz"
          cp "$(readlink result-appimage)" "dist/starla-tray-${{ matrix.appimage-arch }}.AppImage"
          mv pkg/starla/*.deb pkg/starla/*.rpm dist/
          mv gui-pkg/*.deb gui-pkg/*.rpm dist/

      - name: Sign artifacts
        run: |
          cd dist
          for f in *; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts-${{ matrix.arch }}
          path: dist/

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push OCI image
        run: |
          nix build .#packages.${{ matrix.nix-system }}.oci -o result-oci
          skopeo copy \
            "docker-archive:$(readlink result-oci)" \
            "docker://ghcr.io/ananthb/starla:${GITHUB_REF_NAME}-${{ matrix.arch }}"

      - name: Sign per-arch image
        env:
          COSIGN_YES: "true"
        run: |
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}-${{ matrix.arch }}"

  linux-manifest:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: sigstore/cosign-installer@v3

      - name: Create multi-arch manifest
        run: |
          nix shell nixpkgs#manifest-tool -c manifest-tool \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            push from-args \
            --platforms linux/amd64,linux/arm64 \
            --template "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}-ARCH" \
            --target "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}"
          nix shell nixpkgs#manifest-tool -c manifest-tool \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            push from-args \
            --platforms linux/amd64,linux/arm64 \
            --template "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}-ARCH" \
            --target "ghcr.io/ananthb/starla:latest"

      - name: Sign multi-arch tags
        env:
          COSIGN_YES: "true"
        run: |
          cosign login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign "ghcr.io/ananthb/starla:${GITHUB_REF_NAME}"
          cosign sign "ghcr.io/ananthb/starla:latest"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build DMG
        run: |
          nix build .#packages.aarch64-darwin.release -o result-dmg
          mkdir -p dist
          cp "$(readlink result-dmg)" dist/starla-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly

      - name: Build probe
        run: cargo build --release --bin starla --all-features

      - name: Build MSI
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p msi-staging
          cp target/release/starla.exe msi-staging/
          cp config.toml.example msi-staging/
          cp packaging/starla.wxs msi-staging/
          cd msi-staging
          dotnet tool install --global wix --version 5.0.2
          wix build starla.wxs -d Version="$VERSION" -arch x64 -o starla.msi

      - name: Package Windows release
        shell: bash
        run: |
          mkdir -p dist
          cp msi-staging/starla.msi dist/starla-windows-amd64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: sigstore/cosign-installer@v3

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Sign macOS and Windows artifacts
      - name: Sign non-Linux artifacts
        run: |
          cd artifacts
          for f in starla-macos-*.dmg starla-windows-*.msi; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          # Regenerate checksums for all artifacts
          sha256sum $(ls -1 | grep -v '\.sig$\|\.pem$\|SHA256SUMS') > SHA256SUMS
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

  crates-io:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: ananthb
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Publish starla-common
        run: nix develop -c cargo publish -p starla-common
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing
        run: sleep 30

      - name: Publish starla-network
        run: nix develop -c cargo publish -p starla-network
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish starla-controller
        run: nix develop -c cargo publish -p starla-controller
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish starla-metrics
        run: nix develop -c cargo publish -p starla-metrics
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing
        run: sleep 30

      - name: Publish starla-measurements
        run: nix develop -c cargo publish -p starla-measurements
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish starla-results
        run: nix develop -c cargo publish -p starla-results
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing
        run: sleep 30

      - name: Publish starla-scheduler
        run: nix develop -c cargo publish -p starla-scheduler
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io indexing
        run: sleep 30

      - name: Publish starla
        run: nix develop -c cargo publish -p starla
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish starla-tray
        run: nix develop -c cargo publish -p starla-tray
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
