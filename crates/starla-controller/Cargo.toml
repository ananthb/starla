[package]
name = "starla-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "RIPE Atlas controller communication for the Starla software probe"
repository.workspace = true
readme = "README.md"

[dependencies]
starla-common = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
russh = { workspace = true }
ssh-key = { version = "0.6", features = ["ed25519"] }
# Use rand 0.10 to match russh's CryptoRng (rand_core 0.10) — separate from
# the workspace rand 0.8 used by other crates.
rand = { version = "0.10", features = ["thread_rng"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
hostname = "0.4.2"
sha2 = "0.10"
base64 = "0.23"
